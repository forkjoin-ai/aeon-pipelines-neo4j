title = "aeon-pipelines-neo4j — Aeon pipeline analysis inside Neo4j"

[site.project]
name = "Aeon Pipelines Neo4j"
tagline = "Run Aeon-style pipeline topology analysis where your graph already lives."
description = "A Java stored-procedure extension for analyzing pipeline-shaped graphs inside Neo4j. It bridges graph data you already hold in Neo4j to the topological analysis surface from Aeon Pipelines — no export step required."
logo = "diamond"
accent = "#018bff"
theme = "dark"
repo = "forkjoin-ai/aeon-pipelines-neo4j"

[site.sigil]
seed = "aeon-pipelines-neo4j"
motion = "drift"
coherence = "ring"
